<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 — Page Not Found</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #FAF5EA;
      --floor: #EAD9BA;
      --floor-line: #DEC8A0;
      --text-dark: #25211E;
      --text-muted: #8B7D6B;
      --num-base: #E8D7B7;
      --num-reveal: #C79F62;
      --bird: #242120;
      --beak: #E86A33;
      --cheek: #F28B82;
      --lens-rim: #352E2A;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    .header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: clamp(36px, 10vh, 96px) 20px 16px;
    }

    .header h1 {
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .header p {
      font-size: clamp(14px, 2vw, 16px);
      color: var(--text-muted);
      font-weight: 400;
    }

    .stage {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 280px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: clamp(72px, 16vh, 130px);
      background: var(--floor);
      border-top: 3px solid var(--floor-line);
      z-index: 2;
    }

    .glyph-layer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: clamp(44px, 12vh, 96px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
      z-index: 1;
    }

    .glyph-text {
      font-size: clamp(150px, 31vw, 340px);
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: 0.02em;
      color: var(--num-base);
      font-variant-numeric: tabular-nums;
    }

    .glyph-reveal {
      z-index: 3;
      clip-path: circle(0px at 50% 50%);
      will-change: clip-path;
    }

    .glyph-reveal .glyph-text {
      color: var(--num-reveal);
      text-shadow: 0 4px 18px rgba(199, 159, 98, 0.25);
      transform: scale(1.03);
    }

    /* Bird Detective */
    .bird-wrap {
      position: absolute;
      bottom: clamp(68px, 15.2vh, 122px);
      left: 50%;
      width: 112px;
      height: 116px;
      z-index: 6;
      pointer-events: none;
      transform: translateX(-50%);
      will-change: transform;
    }

    .bird-body-group {
      position: relative;
      width: 100%;
      height: 100%;
      transform-origin: center bottom;
    }

    .bird-wrap.is-walking .bird-body-group {
      animation: waddle 0.26s ease-in-out infinite alternate;
    }

    @keyframes waddle {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-5px) rotate(3deg); }
    }

    .speech-bubble {
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      background: #FFFDF8;
      color: var(--text-dark);
      border: 1.5px solid #D8C4A0;
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 6px 14px rgba(37, 33, 30, 0.08);
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .speech-bubble.is-visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .bird-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .bird-wrap.facing-left .bird-flip {
      transform: scaleX(-1);
      transform-origin: 56px 60px;
    }

    .leg {
      transform-origin: top center;
    }

    .bird-wrap.is-walking .leg-left {
      animation: step-a 0.26s ease-in-out infinite alternate;
    }

    .bird-wrap.is-walking .leg-right {
      animation: step-b 0.26s ease-in-out infinite alternate;
    }

    @keyframes step-a {
      0% { transform: rotate(-16deg); }
      100% { transform: rotate(16deg); }
    }

    @keyframes step-b {
      0% { transform: rotate(16deg); }
      100% { transform: rotate(-16deg); }
    }

    /* Magnifying Glass */
    .magnifier {
      position: fixed;
      top: 0;
      left: 0;
      width: 116px;
      height: 116px;
      margin-left: -58px;
      margin-top: -58px;
      border-radius: 50%;
      border: 7px solid var(--lens-rim);
      background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.42), rgba(255, 249, 232, 0.12) 60%, rgba(199, 159, 98, 0.08));
      box-shadow:
        0 10px 25px rgba(37, 33, 30, 0.14),
        inset 0 0 12px rgba(255, 255, 255, 0.5);
      pointer-events: none;
      z-index: 7;
      will-change: transform;
    }

    .magnifier::after {
      content: "";
      position: absolute;
      top: 16px;
      left: 18px;
      width: 22px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
      transform: rotate(-35deg);
    }

    .magnifier-arm {
      position: fixed;
      top: 0;
      left: 0;
      height: 7px;
      background: var(--lens-rim);
      border-radius: 999px;
      transform-origin: 0 50%;
      pointer-events: none;
      z-index: 5;
      will-change: transform, width;
    }

    @media (max-width: 600px) {
      .bird-wrap {
        width: 88px;
        height: 92px;
      }
      .magnifier {
        width: 88px;
        height: 88px;
        margin-left: -44px;
        margin-top: -44px;
        border-width: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <header class="header">
      <h1>Page Not Found</h1>
      <p>There is nothing at this address.</p>
    </header>

    <section class="stage" aria-hidden="true">
      <div class="glyph-layer">
        <span class="glyph-text">404</span>
      </div>

      <div class="glyph-layer glyph-reveal" id="glyphReveal">
        <span class="glyph-text">404</span>
      </div>

      <div class="bird-wrap" id="bird">
        <div class="speech-bubble" id="bubble">nothing here</div>
        <div class="bird-body-group">
          <svg class="bird-svg" viewBox="0 0 112 116" fill="none">
            <!-- Legs -->
            <g class="leg leg-left" style="transform-origin: 46px 92px;">
              <line x1="46" y1="90" x2="46" y2="108" stroke="#E86A33" stroke-width="4" stroke-linecap="round" />
              <path d="M46 108 L54 109 M46 108 L40 109" stroke="#E86A33" stroke-width="3.5" stroke-linecap="round" />
            </g>
            <g class="leg leg-right" style="transform-origin: 64px 92px;">
              <line x1="64" y1="90" x2="64" y2="108" stroke="#E86A33" stroke-width="4" stroke-linecap="round" />
              <path d="M64 108 L72 109 M64 108 L58 109" stroke="#E86A33" stroke-width="3.5" stroke-linecap="round" />
            </g>

            <g class="bird-flip">
              <!-- Crest feathers -->
              <path d="M48 24 C45 12, 54 10, 56 22" fill="#242120" />
              <path d="M56 22 C58 11, 67 14, 62 25" fill="#242120" />
              <!-- Tail -->
              <path d="M22 64 L8 56 L14 70 L24 72 Z" fill="#242120" />
              <!-- Round Body -->
              <ellipse cx="56" cy="58" rx="34" ry="35" fill="#242120" />
              <!-- Wing -->
              <ellipse cx="42" cy="64" rx="14" ry="18" transform="rotate(14 42 64)" fill="#322D2B" />
              <!-- Cheeks -->
              <circle cx="54" cy="58" r="4.5" fill="#F28B82" opacity="0.78" />
              <circle cx="80" cy="58" r="4" fill="#F28B82" opacity="0.78" />
              <!-- Eyes -->
              <circle cx="59" cy="48" r="8.5" fill="#FFFFFF" />
              <circle cx="76" cy="48" r="8.5" fill="#FFFFFF" />
              <circle id="pupilL" cx="61" cy="48" r="4.1" fill="#1D1A18" />
              <circle id="pupilR" cx="78" cy="48" r="4.1" fill="#1D1A18" />
              <circle cx="62.5" cy="46.2" r="1.4" fill="#FFFFFF" />
              <circle cx="79.5" cy="46.2" r="1.4" fill="#FFFFFF" />
              <!-- Beak -->
              <path d="M84 50 L98 55 L84 61 Z" fill="#E86A33" />
            </g>
          </svg>
        </div>
      </div>

      <div class="floor"></div>
    </section>

    <div class="magnifier-arm" id="arm"></div>
    <div class="magnifier" id="magnifier"></div>
  </main>

  <script>
    (function () {
      const bird = document.getElementById("bird");
      const magnifier = document.getElementById("magnifier");
      const arm = document.getElementById("arm");
      const glyphReveal = document.getElementById("glyphReveal");
      const bubble = document.getElementById("bubble");
      const pupilL = document.getElementById("pupilL");
      const pupilR = document.getElementById("pupilR");

      const phrases = ["nothing here", "check twice", "404...", "empty"];
      let phraseIdx = 0;

      let vw = window.innerWidth;
      let vh = window.innerHeight;
      let targetX = vw * 0.56;
      let targetY = vh * 0.62;
      let lensX = targetX;
      let lensY = targetY;
      let birdX = vw * 0.42;
      let lastInputAt = 0;
      let bubbleTimer = null;

      function showBubble() {
        bubble.textContent = phrases[phraseIdx % phrases.length];
        phraseIdx++;
        bubble.classList.add("is-visible");
        clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(() => bubble.classList.remove("is-visible"), 1400);
      }

      function onPointer(x, y) {
        targetX = Math.max(40, Math.min(vw - 40, x));
        targetY = Math.max(120, Math.min(vh - 30, y));
        lastInputAt = performance.now();
      }

      window.addEventListener("pointermove", (e) => onPointer(e.clientX, e.clientY), { passive: true });
      window.addEventListener("touchmove", (e) => {
        const t = e.touches && e.touches[0];
        if (t) onPointer(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener("pointerdown", (e) => {
        onPointer(e.clientX, e.clientY);
        showBubble();
      }, { passive: true });

      window.addEventListener("resize", () => {
        vw = window.innerWidth;
        vh = window.innerHeight;
      });

      function tick(now) {
        // Gentle idle patrol when no pointer activity for >2.5s
        if (now - lastInputAt > 2500) {
          const t = now * 0.0012;
          targetX = vw * 0.5 + Math.sin(t) * Math.min(vw * 0.24, 220);
          targetY = vh * 0.64 + Math.cos(t * 1.7) * 28;
        }

        lensX += (targetX - lensX) * 0.18;
        lensY += (targetY - lensY) * 0.18;

        const desiredBirdX = Math.max(70, Math.min(vw - 70, lensX + (lensX > birdX ? -78 : 78)));
        const dxBird = desiredBirdX - birdX;
        birdX += dxBird * 0.08;

        const walking = Math.abs(dxBird) > 2.2;
        bird.classList.toggle("is-walking", walking);
        bird.classList.toggle("facing-left", lensX < birdX);
        bird.style.left = `${birdX}px`;

        // Eye tracking
        const rect = bird.getBoundingClientRect();
        const eyeCenterX = rect.left + rect.width * 0.6;
        const eyeCenterY = rect.top + rect.height * 0.42;
        const angle = Math.atan2(lensY - eyeCenterY, lensX - eyeCenterX);
        const ex = Math.cos(angle) * 2.5 * (lensX < birdX ? -1 : 1);
        const ey = Math.sin(angle) * 2.3;
        pupilL.setAttribute("cx", (61 + ex).toFixed(2));
        pupilL.setAttribute("cy", (48 + ey).toFixed(2));
        pupilR.setAttribute("cx", (78 + ex).toFixed(2));
        pupilR.setAttribute("cy", (48 + ey).toFixed(2));

        // Position magnifying glass
        const radius = vw <= 600 ? 38 : 51;
        magnifier.style.transform = `translate3d(${lensX}px, ${lensY}px, 0)`;

        // Connect handle from bird's wing/hand to edge of magnifying glass
        const handX = birdX + (lensX < birdX ? -24 : 24);
        const handY = rect.top + rect.height * 0.62;
        const dx = lensX - handX;
        const dy = lensY - handY;
        const dist = Math.hypot(dx, dy);
        const armAngle = Math.atan2(dy, dx);
        const armLen = Math.max(0, dist - radius);
        arm.style.width = `${armLen}px`;
        arm.style.transform = `translate3d(${handX}px, ${handY}px, 0) rotate(${armAngle}rad)`;

        // Spotlight clip-path on revealed 404 layer
        const revealRect = glyphReveal.getBoundingClientRect();
        const relX = lensX - revealRect.left;
        const relY = lensY - revealRect.top;
        glyphReveal.style.clipPath = `circle(${radius}px at ${relX}px ${relY}px)`;

        requestAnimationFrame(tick);
      }

      setTimeout(showBubble, 900);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
